<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminderski</title>
<style>
  :root {
    --ink: #0d0d0b;
    --paper: #ffffff;
    --label: #6b6960;
    --bar: #0a0a08;
    --bar-ink: #f2f1ea;
    --hover: #f0efea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 Consolas, "Cascadia Mono", ui-monospace, monospace;
  }

  header {
    background: var(--bar);
    color: var(--bar-ink);
    padding: 0 18px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    letter-spacing: 0.22em;
  }
  header .count { font-weight: 400; letter-spacing: 0.16em; font-size: 12px; }

  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }

  h2 {
    margin: 32px 0 12px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--label);
  }
  h2:first-child { margin-top: 0; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

  li {
    border: 1px solid var(--ink);
    padding: 14px 16px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  li.done { border-color: var(--label); color: var(--label); }

  .what { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .when {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--label);
    margin-top: 6px;
  }
  .overdue { color: var(--ink); font-weight: 700; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 7px 12px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button.filled { background: var(--ink); color: var(--paper); font-weight: 700; }
  button.filled:hover { background: #26261f; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .empty { color: var(--label); font-size: 13px; }

  .editor { flex: 1 1 100%; display: flex; flex-direction: column; gap: 10px; }
  .editor textarea, .editor input {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 8px 10px;
    width: 100%;
  }
  .editor textarea { resize: vertical; min-height: 4.5em; }
  .editor textarea:focus, .editor input:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
  .editor .problem { font-size: 13px; font-weight: 700; min-height: 1.5em; }
  .editor .actions { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <span>REMINDERSKI</span>
  <span class="count" id="count"></span>
</header>

<main>
  <h2>Waiting</h2>
  <ul id="waiting"></ul>
  <h2>Done</h2>
  <ul id="done"></ul>
</main>

<script>
  const SNOOZES = [["+30 min", 30], ["+2 hrs", 120], ["tomorrow", null]];

  function when(due) {
    const at = new Date(due * 1000);
    const seconds = due - Math.floor(Date.now() / 1000);
    const clock = at.toLocaleString(undefined, {
      weekday: "short", hour: "2-digit", minute: "2-digit"
    });
    if (seconds <= 0) return { text: `overdue · ${clock}`, overdue: true };

    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return { text: `in ${minutes} min · ${clock}`, overdue: false };
    const hours = Math.round(minutes / 60);
    if (hours < 24) return { text: `in ${hours} h · ${clock}`, overdue: false };
    return { text: `in ${Math.round(hours / 24)} d · ${clock}`, overdue: false };
  }

  // Tomorrow at nine, worked out here because the browser knows the reader's clock.
  function minutesUntilTomorrowMorning() {
    const morning = new Date();
    morning.setDate(morning.getDate() + 1);
    morning.setHours(9, 0, 0, 0);
    return Math.max(1, Math.round((morning - Date.now()) / 60000));
  }

  async function send(path) {
    await fetch(path, { method: "POST" });
    await load();
  }

  function action(label, onClick, filled) {
    const button = document.createElement("button");
    button.textContent = label;
    if (filled) button.className = "filled";
    button.addEventListener("click", onClick);
    return button;
  }

  function row(reminder) {
    const item = document.createElement("li");
    if (reminder.done) item.className = "done";

    const what = document.createElement("div");
    what.className = "what";
    what.textContent = reminder.text;

    const moment = when(reminder.due);
    const timing = document.createElement("div");
    timing.className = "when" + (moment.overdue && !reminder.done ? " overdue" : "");
    timing.textContent = reminder.snoozes > 0
      ? `${moment.text} · snoozed ${reminder.snoozes}×`
      : moment.text;
    what.append(timing);

    const actions = document.createElement("div");
    actions.className = "actions";
    // First rather than last, so that it is as far as it can be from Done.
    actions.append(action("Delete", () => {
      if (confirm(`Delete this reminder for good?\n\n${reminder.text}`)) {
        send(`/reminders/${reminder.id}/delete`);
      }
    }));
    if (reminder.done) {
      actions.append(action("Put back", () => send(`/reminders/${reminder.id}/pending`)));
    } else {
      actions.append(action("Edit", () => edit(item, reminder)));
      for (const [label, minutes] of SNOOZES) {
        const howLong = minutes ?? minutesUntilTomorrowMorning();
        actions.append(action(label, () => send(`/reminders/${reminder.id}/snooze/${howLong}`)));
      }
      actions.append(action("Done", () => send(`/reminders/${reminder.id}/done`), true));
    }

    item.append(what, actions);
    return item;
  }

  // The row being edited, if any. The list is not redrawn while it is open, since that would
  // throw away what is being typed.
  let editing = null;

  function edit(item, reminder) {
    if (editing) editing.cancel();

    const editor = document.createElement("div");
    editor.className = "editor";

    const text = document.createElement("textarea");
    text.value = reminder.text;
    text.rows = Math.min(8, reminder.text.split("\n").length + 1);

    const time = document.createElement("input");
    time.placeholder = "Keep the time, or: in 2h · at 3pm · friday at 9";
    time.setAttribute("aria-label", "When");

    const problem = document.createElement("div");
    problem.className = "problem";
    problem.setAttribute("role", "alert");

    const close = () => {
      editing = null;
      item.replaceWith(row(reminder));
      // Anything done elsewhere on the page while this was open has not been drawn yet.
      load();
    };
    const save = async () => {
      const answer = await fetch(`/reminders/${reminder.id}/edit`, {
        method: "POST",
        body: `${time.value}\n${text.value}`,
      });
      if (answer.ok) {
        editing = null;
        await load();
      } else if (answer.status === 404) {
        problem.textContent = "This reminder is no longer waiting.";
      } else {
        problem.textContent = await answer.text();
      }
    };

    for (const field of [text, time]) {
      field.addEventListener("keydown", (event) => {
        if (event.key === "Escape") close();
        // Enter starts a new line in the text, so saving from there wants Ctrl as well.
        if (event.key === "Enter" && (field === time || event.ctrlKey)) {
          event.preventDefault();
          save();
        }
      });
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(action("Cancel", close), action("Save", save, true));

    editor.append(text, time, problem, actions);
    item.replaceChildren(editor);
    editing = { cancel: close };
    text.focus();
  }

  function fill(list, reminders, nothing) {
    list.replaceChildren();
    if (reminders.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.style.border = "none";
      empty.style.padding = "0";
      empty.textContent = nothing;
      list.append(empty);
      return;
    }
    for (const reminder of reminders) list.append(row(reminder));
  }

  async function load() {
    let reminders = [];
    try {
      reminders = await (await fetch("/reminders")).json();
    } catch {
      document.getElementById("count").textContent = "NOT RUNNING";
      return;
    }
    // Checked after the wait rather than before it, since an editor may have opened meanwhile.
    if (editing) return;

    const waiting = reminders.filter((r) => !r.done).sort((a, b) => a.due - b.due);
    const done = reminders.filter((r) => r.done).sort((a, b) => b.due - a.due);

    fill(document.getElementById("waiting"), waiting, "Nothing waiting.");
    fill(document.getElementById("done"), done, "Nothing finished yet.");
    document.getElementById("count").textContent =
      `${waiting.length} WAITING`;
  }

  load();
  // Reminders fall due while the page is open, and the times shown are relative.
  setInterval(load, 15000);
</script>
</body>
</html>
