name: Release

# Tagging is what publishes. Pushing 0.0.1, or v0.0.1, builds that commit and attaches the
# executables to a GitHub release of the same name. Both spellings work, because having to
# remember which one the workflow wanted is how the first release failed to build.
on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Name the executable after the architecture it is for
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/reminderski.exe" \
             "dist/reminderski-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Before the artifacts, because checking out cleans the workspace it lands in. The whole
      # history and every tag, because the notes are the commits between this tag and the one
      # before it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the release notes from the commits in this tag
        run: bash .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      # winget identifies a download by its hash, so publish the hashes with the executables.
      - name: Record the hashes
        shell: bash
        run: cd dist && sha256sum *.exe > checksums.txt && cat checksums.txt
      # Creating a release in the GitHub interface creates the tag too, so by the time this runs
      # the release usually exists already and only wants its executables attaching.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            # A release made in the interface may already say something somebody wrote by hand,
            # and overwriting that would be the one way this can lose work. Only fill in a blank.
            existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                       --json body --jq .body)
            if [ -z "$existing" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
            fi
          else
            # A draft, so the notes can be read and edited before anybody downloads anything.
            # Publishing it is one button on the release page.
            gh release create "$GITHUB_REF_NAME" dist/* --draft --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
