name: Release

# Tagging is what publishes. Pushing v0.0.1 builds that commit and attaches the executables
# to a GitHub release of the same name.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Name the executable after the architecture it is for
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/reminderski.exe" \
             "dist/reminderski-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # winget identifies a download by its hash, so publish the hashes with the executables.
      - name: Record the hashes
        shell: bash
        run: cd dist && sha256sum *.exe > checksums.txt && cat checksums.txt
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
