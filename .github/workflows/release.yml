name: Release

# Tagging is what publishes. Pushing 0.0.1, or v0.0.1, builds that commit and attaches the
# executables to a GitHub release of the same name. Both spellings work, because having to
# remember which one the workflow wanted is how the first release failed to build.
on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Name the executable after the architecture it is for
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/reminderski.exe" \
             "dist/reminderski-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # winget identifies a download by its hash, so publish the hashes with the executables.
      - name: Record the hashes
        shell: bash
        run: cd dist && sha256sum *.exe > checksums.txt && cat checksums.txt
      # Creating a release in the GitHub interface creates the tag too, so by the time this runs
      # the release usually exists already and only wants its executables attaching.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
