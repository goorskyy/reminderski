[package]
name = "reminderski"
version = "0.0.1"
edition = "2024"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# A small, quick executable is worth more here than a fast build.
lto = true
codegen-units = 1
strip = true
# A panic crossing back into a Windows callback is undefined behaviour, so stopping at the
# panic is safer than unwinding through it.
panic = "abort"

[lints.clippy]
all = { level = "deny", priority = -1 }
